spring.application.name=orcamento-ia

# --- Provedor de IA ---------------------------------------------------------
# Trocar de provedor e so mudar esta variavel: AI_PROVIDER=openai ./mvnw spring-boot:run
# ollama = modelo local, gratuito, sem chave (padrao)
# openai = modelo na nuvem, exige OPENAI_API_KEY com credito
spring.ai.model.chat=${AI_PROVIDER:ollama}

# A transcricao de audio so existe na OpenAI (Whisper). Sem OPENAI_API_KEY ela
# fica indisponivel e o ditado de voz e feito pelo navegador (Web Speech API).
spring.ai.model.audio.transcription=openai

# --- Ollama (padrao) --------------------------------------------------------
# Requer o Ollama rodando localmente: ollama serve
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5}
spring.ai.ollama.chat.options.temperature=0.1
# Nao baixar modelo sozinho no boot: o download e explicito, via ollama pull.
spring.ai.ollama.init.pull-model-strategy=never

# --- OpenAI (alternativa) ---------------------------------------------------
# O default da chave permite subir a aplicacao sem ela: as transacoes e a
# interface web continuam funcionando e os recursos de IA respondem 502.
spring.ai.openai.api-key=${OPENAI_API_KEY:chave-nao-configurada}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.audio.transcription.options.model=whisper-1

# Limite de upload para os arquivos de audio
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:orcamentodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
