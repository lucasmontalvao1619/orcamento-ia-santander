spring.application.name=orcamento-ia

# Chave da OpenAI lida da variavel de ambiente OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Modelo de chat usado pelo ChatClient e Tool Calling
spring.ai.openai.chat.options.model=gpt-4o-mini

# Modelo de transcricao de audio (voz para texto)
spring.ai.openai.audio.transcription.options.model=whisper-1

# Limite de upload para os arquivos de audio
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:orcamentodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
