# Configuracao usada apenas pelos testes.
#
# Existe por um motivo especifico: sem este arquivo os testes que sobem o
# contexto do Spring herdam o application.properties de producao e abrem o
# banco em arquivo (dados/orcamento) com ddl-auto=update — ou seja, `mvn test`
# mexeria nos lancamentos reais de quem estiver usando o aplicativo.
spring.application.name=orcamento-ia

# Banco descartavel, criado e destruido a cada execucao da suite.
spring.datasource.url=jdbc:h2:mem:orcamento-teste;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Os testes nao falam com provedor de IA nenhum: as chamadas sao dubladas por
# mocks. O que importa aqui e o contexto subir sem exigir Ollama nem chave.
spring.ai.model.chat=ollama
spring.ai.model.audio.transcription=openai
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.openai.api-key=chave-de-teste

investimentos.cdi-anual=0.1065
assistente.memoria-ativa=false
